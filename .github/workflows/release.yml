name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build eLuajs.jar
        run: |
          cd source
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Build portable runtime
        run: |
          chmod +x source/packaging/build_runtime.sh
          source/packaging/build_runtime.sh runtime
      - name: Package Linux
        run: |
          gcc -O2 -s -o eLuajs source/packaging/launcher.c
          rm -rf dist
          mkdir -p dist/eLuajs/app
          cp eLuajs dist/eLuajs/
          cp source/out/eLuajs.jar dist/eLuajs/app/
          cp -r runtime dist/eLuajs/runtime
          cp eLuajs-icon.png eLuajs.desktop README.md LICENSE dist/eLuajs/
          chmod +x dist/eLuajs/eLuajs
          cd dist
          zip -r ../eLuajs-linux-x86_64.zip eLuajs
          tar -czf /tmp/eluajs-payload.tar.gz eLuajs
          cd ..
          cat source/packaging/linux-installer.sh /tmp/eluajs-payload.tar.gz > eLuajs-linux-x86_64.run
          chmod +x eLuajs-linux-x86_64.run
      - name: Stage jar for release
        run: cp source/out/eLuajs.jar eLuajs.jar
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            eLuajs-linux-x86_64.zip
            eLuajs-linux-x86_64.run
            eLuajs.jar

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare WiX Toolset
        shell: powershell
        run: |
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wixBin\candle.exe")) {
            choco install wixtoolset --version=3.14.1 -y --no-progress
          }
          if (-not (Test-Path "$wixBin\candle.exe")) {
            throw "WiX Toolset (candle.exe) not found"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
          Get-ChildItem "$wixBin\candle.exe", "$wixBin\light.exe" | Select-Object Name, FullName
      - name: Build eLuajs.jar
        run: |
          cd source
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Build portable Windows runtime
        run: |
          export JAVA_HOME="$(cygpath -u "$JAVA_HOME")"
          chmod +x source/packaging/build_runtime.sh
          source/packaging/build_runtime.sh runtime
      - name: Build Windows installer
        run: |
          rm -rf dist-installer dist/jpackage-input
          mkdir -p dist/jpackage-input
          cp source/out/eLuajs.jar dist/jpackage-input/
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *.*.*) ;; *.*) VERSION="$VERSION.0" ;; *) VERSION="$VERSION.0.0" ;; esac
          jpackage --type exe --name eLuajs --app-version "$VERSION" \
            --vendor "Efkwn Mobile" --description "Lightweight Android Java IDE" \
            --input dist/jpackage-input --main-jar eLuajs.jar --main-class eluajs.Main \
            --runtime-image runtime --icon eLuajs.ico \
            --win-shortcut --win-menu --win-dir-chooser --win-per-user-install \
            --dest dist-installer
          cp dist-installer/*.exe eLuajs-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: eLuajs-windows-x86_64.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
