name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build eLuajs.jar
        run: |
          cd source
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Verify jar
        run: |
          test -f source/out/eLuajs.jar
          unzip -p source/out/eLuajs.jar META-INF/MANIFEST.MF | grep -q 'Main-Class: eluajs.Main'

      - name: Build portable runtime
        run: |
          chmod +x source/packaging/build_runtime.sh
          source/packaging/build_runtime.sh runtime

      - name: Build launcher and package
        run: |
          gcc -O2 -s -o eLuajs source/packaging/launcher.c
          rm -rf dist
          mkdir -p dist/eLuajs/app
          cp eLuajs dist/eLuajs/
          cp source/out/eLuajs.jar dist/eLuajs/app/
          cp -r runtime dist/eLuajs/runtime
          cp eLuajs-icon.png eLuajs.desktop README.md LICENSE dist/eLuajs/
          chmod +x dist/eLuajs/eLuajs
          cd dist
          zip -r ../eLuajs-linux-x86_64.zip eLuajs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/out/eLuajs.jar
            eLuajs-linux-x86_64.zip
          generate_release_notes: true
